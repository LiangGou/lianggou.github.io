# Post stats (Cloudflare Worker + D1, see worker/README.md).
# Empty worker_url = counters hidden until the backend is live.
stats:
  worker_url: "https://blog-stats.lgou-psu.workers.dev"

# Site settings
title: "Liang Gou"
description: "Writing on AI and engineering leadership — by an AI enthusiast seeking the perfect blend of mind, body, and technology."
url: "https://lianggou.github.io"
baseurl: ""
repository: "LiangGou/lianggou.github.io"
locale: "en-US"

# Comments (giscus — powered by GitHub Discussions, no ads, no extra accounts)
comments:
  provider: "giscus"
  giscus:
    repo_id: "R_kgDOKKkKzA"
    category_name: "General"
    category_id: "DIC_kwDOKKkKzM4DGerK"
    discussion_term: "pathname"
    theme: "light"

# Theme: Minimal Mistakes (remote theme, GitHub Pages compatible)
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "air"

# Plugins (all on the GitHub Pages whitelist)
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-include-cache

markdown: kramdown

# Feed
feed:
  path: feed.xml
  posts_limit: 20

# Author profile (sidebar)
author:
  name: "Liang Gou"
  avatar: "/assets/images/profile.jpg"
  bio: "AI enthusiast finding balance through coding, marathoning, meditation, and fasting."
  location: "San Francisco Bay Area"
  links:
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=x3VK0fAAAAAJ"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/lianggou"
    # Email and Feed are rendered via _includes/author-profile-custom-links.html
    # so the email address never appears in the page source (spam protection).

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      comments: true

# Exclude from build
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
