<!--
  Contact form. Flow: POST -> Cloudflare Worker (/api/contact) -> honeypot +
  Workers AI spam gate -> forwarded to Formspree (which verifies reCAPTCHA).
  Backend code: worker/worker.js. Defenses documented in worker/README.md.

  SETUP (two steps, both in your accounts):
  1. Formspree: create a new form called "Contact". In its Settings tab,
     enable CAPTCHA -> "Custom reCAPTCHA" and paste your reCAPTCHA SECRET key.
     Then set FORMSPREE_FORM_ID to the form ID in the Worker's dashboard
     variables (until then, legit messages pile up in the D1 contact_inbox).
  2. Google: register lianggou.github.io at
     https://www.google.com/recaptcha/admin (reCAPTCHA v2, Checkbox),
     then replace YOUR_RECAPTCHA_SITE_KEY below with the SITE key.
-->
<div class="contact-box">
  <form action="{{ site.stats.worker_url }}/api/contact" method="POST" class="contact-form">
    <label>
      Your name
      <input type="text" name="name" autocomplete="name" required>
    </label>
    <label>
      Your email
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>
      Message
      <textarea name="message" rows="6" required></textarea>
    </label>
    <!-- Honeypot: invisible to humans, catches naive bots -->
    <input type="text" name="_gotcha" class="contact-honeypot" tabindex="-1" autocomplete="off">
    <input type="hidden" name="_subject" value="Contact form — lianggou.github.io">
    <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>
    <button type="submit">Send message</button>
  </form>
</div>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
